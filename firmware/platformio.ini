; ESP32 IR Blaster/Receiver firmware (board v2.x)
; Build:  pio run            Flash: pio run -t upload        Monitor: pio device monitor
; The board has a CH340C with DTR/RTS auto-reset, so no button presses are needed to flash.

[env:esp32-ir-board]
; espressif32 6.x = Arduino core 2.0.x (IRremoteESP8266 2.8.x is tested against it)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv     ; 1.9 MB app x2 (OTA) + 190 kB LittleFS for saved codes
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    crankyoldgit/IRremoteESP8266@2.8.6
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
